name: Weekly Terminal Alignment Check

on:
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday
  workflow_dispatch: # Allows manual run

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --no-save: install puppeteer for this run only, without touching package.json / lock file
      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      # Fixes drifted terminals AND appends airlines that are on the official list but missing
      # from the DB. It never deletes anything. The scrape exits 1 (and writes nothing) if the
      # terminal split looks wrong.
      - name: Run Terminal Audit Script
        shell: bash
        run: node scripts/audit-db.js --write --add-missing | tee drift-report.txt

      # Airlines in the DB that are no longer on the live list are never removed automatically.
      # They don't change any file, so no PR would mention them: raise one issue instead.
      - name: Flag possibly-removed airlines for manual review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          STALE=$(grep -oP 'possibly no longer serve MNL\): \K\d+' drift-report.txt || echo 0)
          echo "stale=$STALE"
          TITLE="MNL: airlines possibly no longer serving Manila"
          N=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ "$STALE" -gt 0 ]; then
            # Only the stale-airlines table (first box after the warning line), not the whole report.
            awk '/Possibly no longer serving MNL \(report only/{f=1} f{print} f&&/^└/{exit}' drift-report.txt > stale-table.txt
            {
              echo "$STALE database airline(s) are not on the official newnaia.com.ph list."
              echo
              echo "Nothing was removed automatically. Cross-check each one against the airline's own site,"
              echo "then delete the entry by hand in hubs/mnl/mnl-database.js."
              echo "This issue updates itself each run and closes once the list is empty."
              echo
              echo '```'
              cat stale-table.txt
              echo '```'
            } > issue-body.md
            if [ -n "$N" ]; then
              gh issue edit "$N" --body-file issue-body.md
            else
              gh issue create --title "$TITLE" --body-file issue-body.md
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "No stale airlines in the latest audit, closing."
          fi

      - name: Build PR description
        shell: bash
        run: |
          {
            echo '### ✈️ Airport Terminal Alignment Sync'
            echo
            echo 'The automated weekly audit compared the database with the official airport portal and updated the database files below.'
            echo 'New airlines are appended with basic fields only (add logos/links/notes by hand). Nothing is ever removed automatically.'
            echo
            echo 'Please review the modified files and click **Merge pull request** to publish the changes.'
            echo
            echo '<details><summary>Audit output</summary>'
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
            echo '</details>'
          } > pr-body.md

      # Only opens a PR if a database file actually changed.
      - name: Create Pull Request on Terminal Drift
        uses: peter-evans/create-pull-request@v6
        with:
          base: staging
          branch: auto-terminal-update
          delete-branch: true
          # Only these files can ever be committed, whatever else the job created.
          add-paths: |
            hubs/*/*-database.js
          commit-message: "chore(auto-sync): update terminal assignments from airport portals"
          title: "🚨 Automated Terminal Update PR"
          body-path: pr-body.md
          labels: |
            automated-pr
            database

      - name: Upload debug output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scrape-debug/
          if-no-files-found: ignore
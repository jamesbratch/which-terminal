name: Recon - official AOT flight boards

# One-off, manual only. Read-only: loads each official flight page once and prints which
# data fields it exposes (terminal / gate / check-in counter). It changes no files.
on:
  workflow_dispatch:
  # Runs once when this file is pushed to staging (no need to put it on the default branch first).
  # Delete this block after the first successful run.
  push:
    branches: [staging]
    paths:
      - '.github/workflows/recon-official-board.yml'

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      - name: Capture the flight-board data feeds
        run: node scripts/recon-official-board.js

      - name: Upload screenshots, HTML and raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-output
          path: recon-output/
          if-no-files-found: ignore
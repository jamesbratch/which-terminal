name: MNL terminal sync

on:
  schedule:
    - cron: '0 3 * * *'   # daily, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Scrapes the live site, then patches terminals that have drifted.
      # Does NOT append new airlines (no --add-missing): review those by hand.
      # The scrape itself fails the job (exit 1) if the terminal split looks wrong.
      - name: Run terminal audit
        shell: bash
        run: node scripts/audit-db.js --write | tee drift-report.txt

      # New airlines and possibly-removed airlines are never changed automatically, and they
      # don't touch any file, so no PR would be opened. Raise (or refresh) one issue instead.
      - name: Flag new / possibly-removed airlines for manual review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MISSING=$(grep -oP 'Total Missing Airlines Found: \K\d+' drift-report.txt || echo 0)
          STALE=$(grep -oP 'possibly no longer serve MNL\): \K\d+' drift-report.txt || echo 0)
          echo "missing=$MISSING stale=$STALE"
          if [ "$MISSING" -gt 0 ] || [ "$STALE" -gt 0 ]; then
            TITLE="MNL airline list needs manual review"
            {
              echo "The scheduled audit found $MISSING airline(s) on newnaia.com.ph that are not in the database,"
              echo "and $STALE database airline(s) that are not on the live list."
              echo
              echo "Nothing was added or removed automatically. Cross-check each one, then edit hubs/mnl/mnl-database.js by hand."
              echo
              echo '```'
              cat drift-report.txt
              echo '```'
            } > issue-body.md
            N=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
            if [ -n "$N" ]; then
              gh issue edit "$N" --body-file issue-body.md
            else
              gh issue create --title "$TITLE" --body-file issue-body.md
            fi
          fi

      - name: Upload debug output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scrape-debug/
          if-no-files-found: ignore

      # Opens a PR only if the audit actually changed a database file.
      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/mnl-terminal-sync
          commit-message: 'chore(mnl): sync airline terminals from newnaia.com.ph'
          title: 'MNL terminal drift detected'
          body-path: drift-report.txt
          add-paths: |
            hubs/**/*-database.js